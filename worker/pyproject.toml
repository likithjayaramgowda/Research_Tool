[project]
name = "litlens-worker"
version = "0.1.0"
description = "LitLens Modal worker: uploads and long-running jobs only (Docling lives here)."
requires-python = ">=3.12"
dependencies = [
    "litlens-core",
    "modal>=1.0",
]

[tool.uv.sources]
litlens-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["litlens_worker"]
