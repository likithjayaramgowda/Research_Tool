[project]
name = "litlens-api"
version = "0.1.0"
description = "LitLens FastAPI service (runs on Vercel's Python runtime)."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Likith Jayaram Gowda" }]
dependencies = [
    "fastapi>=0.115",
    "litlens-core",
]

[dependency-groups]
dev = ["httpx2>=2.0", "uvicorn>=0.30"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.uv.sources]
litlens-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
