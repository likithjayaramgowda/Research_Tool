name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python 3.12 and all workspace packages
        run: uv sync --all-packages --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Tests
        run: uv run pytest

  web:
    name: Web (lint, typecheck, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (citation formats)
        run: pnpm test:unit

  database:
    # Separate from the fast jobs above: it starts a real local Supabase in Docker and proves
    # tenant isolation with real JWTs. It must never be given a service-role key; the test
    # suite refuses to run if one is in the environment.
    name: Database (schema, RLS and storage isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python 3.12 and all workspace packages
        run: uv sync --all-packages --frozen
      - name: Start Supabase (database, auth, REST and storage only)
        run: >-
          supabase start
          -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Structural checks (pgTAP)
        run: supabase test db
      - name: Isolation tests (real JWTs, public anon key only)
        run: uv run pytest supabase/tests/isolation -v
